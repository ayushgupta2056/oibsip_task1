<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PayCheck</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
        h1 { margin-bottom: 0.25rem; }
        p.sub { color: #666; margin-top: 0; }
        form { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.5rem 0; }
        input, button { padding: 0.5rem 0.75rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #eb001b; color: #fff; border: none; cursor: pointer; }
        #message { min-height: 1.5rem; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
        .APPROVED { color: #1a7f37; font-weight: 600; }
        .DECLINED { color: #c62828; font-weight: 600; }
    </style>
</head>
<body>
<h1>PayCheck</h1>
<p class="sub">Submit a payment and see whether the fraud rules approve or decline it.</p>

<form id="payment-form">
    <input id="cardNumber" placeholder="Card number" value="4111111111111111" required>
    <input id="amount" type="number" step="0.01" placeholder="Amount (₹)" value="2500" required>
    <input id="country" placeholder="Country (e.g. IN)" value="IN" maxlength="2" required>
    <button type="submit">Pay</button>
</form>
<div id="message"></div>

<table>
    <thead>
    <tr><th>ID</th><th>Card</th><th>Amount</th><th>Country</th><th>Status</th><th>Reason</th></tr>
    </thead>
    <tbody id="payments"></tbody>
</table>

<script>
    const form = document.getElementById('payment-form');
    const message = document.getElementById('message');

    async function loadPayments() {
        const payments = await (await fetch('/payments')).json();
        document.getElementById('payments').innerHTML = payments.reverse().map(p => `
            <tr>
                <td>${p.id}</td>
                <td>${p.cardNumber}</td>
                <td>₹${p.amount}</td>
                <td>${p.country}</td>
                <td class="${p.status}">${p.status}</td>
                <td>${p.reason ?? ''}</td>
            </tr>`).join('');
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const response = await fetch('/payments', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                cardNumber: document.getElementById('cardNumber').value,
                amount: document.getElementById('amount').value,
                country: document.getElementById('country').value
            })
        });
        const body = await response.json();
        message.textContent = response.ok
            ? `Payment #${body.id}: ${body.status}${body.reason ? ' (' + body.reason + ')' : ''}`
            : 'Invalid input: ' + Object.entries(body).map(([k, v]) => `${k} ${v}`).join(', ');
        loadPayments();
    });

    loadPayments();
</script>
</body>
</html>
