# Tests use an in-memory H2 database, so they run anywhere (including GitHub Actions)
# without needing PostgreSQL or Docker.
spring:
  datasource:
    url: jdbc:h2:mem:paycheck;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

paycheck:
  fraud:
    max-amount: 100000
    blocked-countries: KP,IR
    max-payments-per-minute: 3
